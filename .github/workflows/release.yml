name: Release ARM64 DMG

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build release disk image
        env:
          VPN_BUILD_ARCH: arm64
        run: |
          set -eu
          version=$(cat VERSION)
          test "$GITHUB_REF_NAME" = "v$version"
          ./build-dmg.sh --release "$(git rev-parse HEAD)"

      - name: Verify packaged app
        run: |
          set -eu
          sha=$(git rev-parse HEAD)
          identifier="$(cat VERSION)+g${sha:0:7}"
          image="build/VPN Kill Switch-$identifier-arm64.dmg"
          mount_dir=$(mktemp -d)
          hdiutil attach -quiet -readonly -nobrowse -mountpoint "$mount_dir" "$image"
          trap 'hdiutil detach "$mount_dir" -quiet' EXIT
          bundle="$mount_dir/VPN Kill Switch.app"
          executable="Contents/MacOS/VPNKillSwitch"
          test "$(lipo -archs "$bundle/$executable")" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print VPNSourceCommit' "$bundle/Contents/Info.plist")" = "$sha"
          test "$(/usr/libexec/PlistBuddy -c 'Print VPNBuildIdentifier' "$bundle/Contents/Info.plist")" = "$identifier"
          codesign --verify --deep --strict "$bundle"
          cmp "$bundle/$executable" "build/VPN Kill Switch.app/$executable"
          diff -r Commands "$mount_dir/Commands"
          test "$(readlink "$mount_dir/Applications")" = /Applications
          cp "$image" "$RUNNER_TEMP/VPN-Kill-Switch-$GITHUB_REF_NAME-arm64.dmg"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/VPN-Kill-Switch-$GITHUB_REF_NAME-arm64.dmg" \
            --verify-tag --title "VPN Kill Switch ${GITHUB_REF_NAME#v}" \
            --notes "Download the ARM64 DMG for an Apple Silicon Mac running macOS 13 or later. Open the image and drag VPN Kill Switch to Applications. The app is ad hoc signed and has not been notarized."
