name: Release macOS disk images

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build and verify all three disk images
        run: |
          set -eu
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          ./Tools/build-release-dmgs.sh "$(git rev-parse HEAD)" "$RUNNER_TEMP/release"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/release/"*.dmg \
            --verify-tag --title "VPN Kill Switch ${GITHUB_REF_NAME#v}" \
            --notes "For macOS 13 or later, choose Universal for either Mac, arm64 for Apple Silicon, or x86_64 for Intel. Open the image and drag VPN Kill Switch to Applications. The app is ad hoc signed and has not been notarized."
